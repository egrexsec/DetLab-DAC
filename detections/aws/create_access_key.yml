schema_version: 2.0.0
kind: detection
id: DET-0201
title: AWS CreateAccessKey
description: Detects creation of a new IAM access key that may indicate persistence, privilege staging, or hands-on-keyboard cloud abuse.
status: validated
severity: high
author: Mell0wx
domain:
- cloud
- identity
platforms:
- aws
canonical_detection:
  intent: Detects creation of a new IAM access key that may indicate persistence, privilege staging, or hands-on-keyboard cloud abuse.
  attack:
    primary:
      technique: T1098
      tactic: persistence
    related:
    - technique: T1078
      tactic: defense-evasion
      name: Valid Accounts
      coverage: related
      rationale: New access keys often support continued use of compromised identities.
    - technique: T1484.001
      tactic: privilege-escalation
      name: Domain or Tenant Policy Modification
      coverage: gap
      rationale: Access key creation should trigger review of follow-on policy changes or privilege expansion.
    - technique: T1530
      tactic: collection
      name: Data from Cloud Storage
      coverage: gap
      rationale: Fresh access keys may be used quickly for cloud data access and collection.
  logsource:
    product: aws
    service: cloudtrail
  analytics:
    logic:
      selection:
        eventName: CreateAccessKey
        eventSource: iam.amazonaws.com
      condition: selection
    selectors:
    - canonical_field: event.action
      platform_field: eventName
      operator: equals
      values:
      - CreateAccessKey
    - canonical_field: cloud.service
      platform_field: eventSource
      operator: equals
      values:
      - iam.amazonaws.com
    condition: selection
telemetry_requirements:
  primary_logsource:
    product: aws
    service: cloudtrail
  data_sources:
  - name: AWS CloudTrail Management Events
    kind: cloud
    provider: aws
    event_names:
    - CreateAccessKey
    notes: Primary event source for access-key creation and caller identity.
  - name: AWS IAM Credential Report
    kind: identity
    provider: aws
    event_names: []
    notes: Useful for key age, rotation posture, and dormant account review.
  cloud_telemetry:
  - provider: aws
    source: CloudTrail
    event_names:
    - CreateAccessKey
    - CreateLoginProfile
    - AttachUserPolicy
    - PutUserPolicy
    - AssumeRole
    notes: Review immediate follow-on identity and privilege actions from the same actor or target principal.
