schema_version: 2.0.0
kind: detection
id: DET-0008
title: PowerShell EncodedCommand Execution
description: Detects PowerShell launched with an encoded command payload.
status: testing
severity: critical
author: mell0wx
domain:
- endpoint
platforms:
- windows
canonical_detection:
  intent: Detects PowerShell launched with an encoded command payload.
  attack:
    primary:
      technique: T1059.001
      tactic: execution
    related: []
  logsource:
    product: windows
    service: powershell
  analytics:
    logic:
      selection:
        Image: powershell.exe
        CommandLine|contains:
        - -enc
        - -encodedcommand
      condition: selection
    selectors:
    - canonical_field: process.name
      platform_field: Image
      operator: equals
      values:
      - powershell.exe
    - canonical_field: process.command_line
      platform_field: CommandLine
      operator: contains_any
      values:
      - -enc
      - -encodedcommand
    condition: selection
telemetry_requirements:
  primary_logsource:
    product: windows
    service: powershell
  data_sources: []
  cloud_telemetry: []
