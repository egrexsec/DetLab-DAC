schema_version: 2.0.0
kind: detection
id: DET-0007
title: Encoded PowerShell Execution
description: Detects PowerShell execution using encoded command arguments.
status: testing
severity: high
author: Mell0wx
domain:
- endpoint
platforms:
- windows
canonical_detection:
  intent: Detects PowerShell execution using encoded command arguments.
  attack:
    primary:
      technique: T1059.001
      tactic: execution
    related: []
  logsource:
    product: windows
    service: process_creation
  analytics:
    logic:
      selection:
        Image|endswith: \powershell.exe
        CommandLine|contains:
        - -enc
        - -encodedcommand
      condition: selection
    selectors:
    - canonical_field: process.name
      platform_field: Image
      operator: endswith_any
      values:
      - \powershell.exe
    - canonical_field: process.command_line
      platform_field: CommandLine
      operator: contains_any
      values:
      - -enc
      - -encodedcommand
    condition: selection
