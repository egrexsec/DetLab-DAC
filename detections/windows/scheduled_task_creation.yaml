schema_version: 2.0.0
kind: detection
id: DET-0005
title: Scheduled Task Creation
description: Detects suspicious creation of Windows scheduled tasks that may establish persistence, stage execution, or hide repeated malicious actions.
status: validated
severity: high
author: Mell0wx
domain:
- endpoint
platforms:
- windows
canonical_detection:
  intent: Detects suspicious creation of Windows scheduled tasks that may establish persistence, stage execution, or hide repeated malicious actions.
  attack:
    primary:
      technique: T1053.005
      tactic: persistence
    related:
    - technique: T1053.005
      tactic: persistence
      name: Scheduled Task
      coverage: direct
      rationale: The detection directly surfaces scheduled task persistence creation.
    - technique: T1059.001
      tactic: execution
      name: PowerShell
      coverage: related
      rationale: Malicious tasks frequently launch PowerShell payloads or script cradles.
    - technique: T1547
      tactic: persistence
      name: Boot or Logon Autostart Execution
      coverage: related
      rationale: Task creation often appears alongside other persistence mechanisms.
    - technique: T1003
      tactic: credential-access
      name: OS Credential Dumping
      coverage: gap
      rationale: Privileged persistence may be followed by credential access from the scheduled payload.
  logsource:
    product: windows
    service: security
  analytics:
    logic:
      selection:
        EventID:
        - 4698
        - 4702
      condition: selection
    selectors:
    - canonical_field: event.code
      platform_field: EventID
      operator: equals
      values:
      - 4698
      - 4702
    condition: selection
telemetry_requirements:
  primary_logsource:
    product: windows
    service: security
  data_sources:
  - name: Windows Security Task Scheduler Events
    kind: endpoint
    provider: windows
    event_names:
