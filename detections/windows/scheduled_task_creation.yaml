workflow_guidance:
  triage_steps:
  - step: Extract the task name, author, trigger, run-as principal, and action command.
    priority: high
    rationale: Those fields quickly distinguish enterprise management noise from attacker persistence.
  - step: Determine whether the task was created by a known admin tool, installer, or software update process.
    priority: medium
    rationale: Reduces false-positive churn from legitimate automation.
  investigation_steps:
  - step: Review the referenced executable or script path, task XML, and subsequent task launches.
    priority: high
    rationale: The payload path often reveals downloader, script, or credential-access intent.
  - step: Correlate with recent Office, PowerShell, rundll32, or certutil activity on the same host and user.
    priority: high
    rationale: Suspicious tasks are commonly a persistence leg of a larger intrusion chain.
  escalation_guidance:
  - Escalate when the task runs from user-writable paths, launches script interpreters, or executes under privileged or service accounts without a clear admin workflow.
  hunt_suggestions:
  - name: New task persistence hunt
    hypothesis: Hosts creating one suspicious task often show other startup or script-based persistence around the same timeframe.
    query_hint: Hunt for task creation followed by powershell.exe, cmd.exe, rundll32.exe, or execution from AppData and Temp paths.
supporting_artifacts:
  artifacts:
  - name: Scheduled task XML
    category: file
    path: C:\Windows\System32\Tasks
    notes: Preserve the XML definition for trigger, principal, and action details.
  - name: Task Scheduler operational log
    category: event_log
    path: Microsoft-Windows-TaskScheduler/Operational
    notes: Confirms registration and execution timeline.
  velociraptor_artifacts:
  - Windows.Sys.Tasks
  - Windows.EventLogs.Evtx
related_detections:
- detection_id: DET-0004
  relationship: parent
  rationale: Office-delivered execution often creates scheduled tasks for persistence.
- detection_id: DET-0001
  relationship: correlated
  rationale: Scheduled tasks frequently execute encoded PowerShell as their action.
- detection_id: DET-0103
  relationship: follow_on
  rationale: Privileged persistence can precede credential dumping from the same host.
response_actions:
- title: Disable the malicious task and preserve its XML definition.
  priority: high
  description: Removes persistence while retaining evidence.
- title: Scope for additional persistence and review the task payload binary or script.
  priority: high
  description: Attackers rarely stop at a single task artifact.
validation:
  tests:
  - name: Simulated schtasks persistence creation
    source: lab
    test_id: scheduled-task-creation-1
  falsepositives:
  - Software deployment systems, endpoint management, and approved admin automation creating legitimate scheduled tasks
references:
- https://attack.mitre.org/techniques/T1053/005/
