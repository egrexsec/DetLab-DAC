id: DET-0105
title: PsExec Service Installation
description: Detects PsExec-style remote service installation that often accompanies SMB or admin-share lateral movement.

logsource:
  product: windows
  service: system

attack:
  technique: T1021.002
  tactic: lateral-movement

severity: high
status: testing
author: Mell0wx

references:
  - https://attack.mitre.org/techniques/T1021/002/

falsepositives:
  - Approved remote administration using PsExec or similar tooling

tests:
  - name: PsExec service creation event
    source: attack-simulation
    test_id: T1021.002

detection:
  selection:
    EventID: 7045
    ServiceName|contains: 'PSEXESVC'
  condition: selection
