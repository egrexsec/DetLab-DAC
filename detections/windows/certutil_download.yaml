schema_version: 2.0.0
kind: detection
id: DET-0003
title: Certutil Download Behavior
description: Detects certutil being used to download remote content.
status: experimental
severity: high
author: Mell0wx
domain:
- endpoint
platforms:
- windows
canonical_detection:
  intent: Detects certutil being used to download remote content.
  attack:
    primary:
      technique: T1105
      tactic: command-and-control
    related:
    - technique: T1218.011
      tactic: defense-evasion
      name: Rundll32
      coverage: related
      rationale: Downloaded payloads are often proxied into execution by LOLBins.
    - technique: T1059.001
      tactic: execution
      name: PowerShell
      coverage: related
      rationale: Certutil download activity frequently sits in broader script-driven chains.
    - technique: T1547
      tactic: persistence
      name: Boot or Logon Autostart Execution
      coverage: gap
      rationale: Downloaded tooling often leads to persistence actions that need separate detections.
  logsource:
    product: windows
    service: sysmon
  analytics:
    logic:
      selection:
        EventID: 1
        Image|endswith: \certutil.exe
        CommandLine|contains:
        - urlcache
        - http
      condition: selection
    selectors:
    - canonical_field: event.code
      platform_field: EventID
      operator: equals
      values:
      - 1
    - canonical_field: process.name
      platform_field: Image
      operator: endswith_any
      values:
      - \certutil.exe
    - canonical_field: process.command_line
      platform_field: CommandLine
      operator: contains_any
      values:
      - urlcache
      - http
    condition: selection
telemetry_requirements:
  primary_logsource:
    product: windows
    service: sysmon
  data_sources:
  - name: Sysmon Process Creation
    kind: endpoint
    provider: windows
    event_names:
    - Event ID 1
    notes: Captures certutil command-line flags and remote URL usage.
  - name: Proxy or DNS telemetry
    kind: network
    provider: network
    event_names: []
    notes: Helps validate remote destination and follow-on connections.
  cloud_telemetry: []
mappings:
- mapping_id: sigma-core
  platform: sigma
  language: sigma
  status: available
  purpose: canonical
  query:
    logsource:
      product: windows
      service: sysmon
    detection:
      selection:
        EventID: 1
        Image|endswith: \certutil.exe
        CommandLine|contains:
        - urlcache
        - http
      condition: selection
  field_mappings:
  - canonical_field: event.code
    platform_field: EventID
    operator: equals
  - canonical_field: process.name
    platform_field: Image
    operator: endswith_any
  - canonical_field: process.command_line
    platform_field: CommandLine
    operator: contains_any
  notes: Current canonical selector logic preserved as the Sigma-style source mapping.
workflow_guidance:
  triage_steps:
  - step: Validate the URL, destination path, parent process, and user context for the certutil execution.
    priority: high
    rationale: Distinguishes admin certificate handling from payload retrieval.
  investigation_steps:
  - step: Retrieve the downloaded file hash, signer information, and subsequent execution history.
    priority: high
    rationale: Determines whether certutil delivered a benign artifact or malware stage.
  escalation_guidance:
  - Escalate if certutil downloads into temp, user profile, or startup-adjacent directories.
  hunt_suggestions:
  - name: Alternate download utility hunt
    hypothesis: The same host or user may also leverage bitsadmin, PowerShell, curl, or mshta for payload retrieval.
    query_hint: Search for outbound download utilities and suspicious remote URLs within the same investigation window.
supporting_artifacts:
  artifacts:
  - name: Browser and proxy history
    category: network
    notes: Can corroborate remote destination access around the certutil event.
  - name: Downloaded file on disk
    category: file
    notes: Preserve the artifact, metadata, and hash before cleanup.
  velociraptor_artifacts:
  - Windows.Forensics.Usn
  - Windows.Network.NetstatEnriched
related_detections:
- detection_id: DET-0001
  relationship: prerequisite
  rationale: Script-driven staging often precedes certutil download behavior.
- detection_id: DET-0002
  relationship: follow_on
  rationale: Downloaded payloads may be executed through rundll32 or similar LOLBins.
response_actions:
- title: Block or sinkhole the remote destination if confirmed malicious.
  priority: high
  description: Prevents additional payload retrieval while scoping the incident.
validation:
  tests:
  - name: Simulated Certutil download
    source: manual
    test_id: certutil-1
  falsepositives:
  - Administrative certificate retrieval or scripted downloads
references:
- https://attack.mitre.org/techniques/T1105/
