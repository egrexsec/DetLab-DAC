[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "detlab"
version = "0.1.0"
description = "Detection-as-code validation and ATT&CK coverage reporting CLI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Mell0wx" }
]
keywords = [
  "detection-as-code",
  "mitre-attack",
  "sigma",
  "security",
  "threat-detection",
  "blue-team"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: System :: Monitoring"
]
dependencies = [
  "typer>=0.12.0",
  "pydantic>=2.7.0",
  "PyYAML>=6.0.1",
  "rich>=13.7.0"
]

[project.urls]
Homepage = "https://github.com/egrexsec/DetLab-DAC"
Repository = "https://github.com/egrexsec/DetLab-DAC"
Issues = "https://github.com/egrexsec/DetLab-DAC/issues"

[project.optional-dependencies]
api = [
  "fastapi>=0.111.0",
  "httpx>=0.27.0",
  "uvicorn[standard]>=0.30.0"
]
dev = [
  "build>=1.2.0",
  "fastapi>=0.111.0",
  "httpx>=0.27.0",
  "pytest>=8.0.0",
  "ruff>=0.4.0",
  "twine>=5.0.0",
  "uvicorn[standard]>=0.30.0"
]

[project.scripts]
detlab = "detlab.main:app"

[tool.setuptools]
packages = ["detlab"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
