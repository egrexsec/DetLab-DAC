name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  contract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install contract dependencies
        run: python -m pip install -r service/requirements-dev.txt

      - name: Validate shared detection contract
        run: PYTHONPATH=service python -m unittest discover -s service/tests -p 'test_*.py' -v

      - name: Audit Python dependencies
        run: service/audit-dependencies.sh

      - name: Static security analysis
        run: bandit -q -r service/detlab

  website:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build website
        run: npm run build
